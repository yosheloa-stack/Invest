services:
  scanner:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SQLITE_PATH: /app/data/scanner.sqlite
      MODEL_DIR: /app/models
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - scanner_data:/app/data
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 30s
      retries: 3
    restart: unless-stopped
volumes:
  scanner_data:
